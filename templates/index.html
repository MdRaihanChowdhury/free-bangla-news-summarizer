<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Bangla News Summarizer</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#2563eb;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:"Noto Sans Bengali",system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.container{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

/* Header */
header{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

header h1{
  font-size:1.6rem;
  font-weight:700;
}

.fetch-btn{
  padding:10px 16px;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,#2563eb,#1e40af);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease;
}

.fetch-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(37,99,235,.25);
}

.fetch-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;
}

/* Card */
.card{
  background:var(--card);
  border-radius:14px;
  padding:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
  display:flex;
  flex-direction:column;
}

.card a{
  color:var(--primary);
  text-decoration:none;
}

.card a:hover{text-decoration:underline;}

.title{
  font-size:1.05rem;
  font-weight:700;
  line-height:1.4;
}

.summary{
  margin-top:10px;
  color:var(--muted);
  line-height:1.6;
  font-size:.95rem;
}

footer{
  margin:40px 0 10px;
  text-align:center;
  font-size:.85rem;
  color:var(--muted);
}

/* Mobile tweaks */
@media(max-width:480px){
  header h1{font-size:1.3rem;}
}
</style>
</head>
<body>

<div class="container">
<header>
  <h1>📰 Free Bangla News Summarizer</h1>
  <button class="fetch-btn" onclick="fetchNow()">Fetch & Summarize</button>
</header>

<main id="list" class="grid">
  <p>নতুন খবর আনতে উপরের বাটনে ক্লিক করুন।</p>
</main>

<footer>
  AI-powered Bangla News Summary • Fast • Free
</footer>
</div>

<script>
async function fetchNow(){
  const btn = document.querySelector('.fetch-btn');
  btn.disabled = true;
  btn.textContent = "Fetching...";

  try{
    await fetch('/fetch');
    const res = await fetch('/api/latest');
    const articles = await res.json();

    const list = document.getElementById('list');
    list.innerHTML = '';

    if(!articles || articles.length === 0){
      list.innerHTML = '<p>কোনো আর্টিকেল পাওয়া যায়নি।</p>';
      return;
    }

    articles.forEach(a=>{
      const card = document.createElement('article');
      card.className='card';
      card.innerHTML=`
        <div class="title"><a href="${a.link}" target="_blank">${a.title}</a></div>
        <div class="summary">${a.summary}</div>
      `;
      list.appendChild(card);
    });

  }catch(e){
    alert("Error: "+e.message);
  }finally{
    btn.disabled=false;
    btn.textContent="Fetch & Summarize";
  }
}
</script>
</body>
</html>
